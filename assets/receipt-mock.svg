<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07111f" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="34" fill="#eef2f7"/>

  <g filter="url(#shadow)">
    <rect x="48" y="46" width="1104" height="728" rx="30" fill="#ffffff" stroke="#d9e0ea"/>
  </g>

  <!-- Header -->
  <rect x="78" y="82" width="142" height="42" rx="21" fill="#fee2e2"/>
  <text x="108" y="109" fill="#991b1b" font-family="Inter, Arial" font-size="16" font-weight="950">REVIEW</text>
  <text x="78" y="166" fill="#0b1b31" font-family="Inter, Arial" font-size="43" font-weight="900">Truth Receipt</text>
  <text x="78" y="204" fill="#64748b" font-family="Inter, Arial" font-size="19">Prompt-to-answer execution audit with preserved evidence.</text>

  <!-- Prompt and Answer -->
  <rect x="78" y="246" width="504" height="132" rx="20" fill="#fbfcfe" stroke="#dfe7f1"/>
  <text x="104" y="284" fill="#64748b" font-family="Inter, Arial" font-size="13" font-weight="900" letter-spacing="2">PROMPT</text>
  <text x="104" y="320" fill="#0b1b31" font-family="Inter, Arial" font-size="19" font-weight="850">Who won Wimbledon?</text>
  <text x="104" y="350" fill="#475569" font-family="Inter, Arial" font-size="17">Ambiguous: year and competition not specified.</text>

  <rect x="618" y="246" width="504" height="132" rx="20" fill="#fbfcfe" stroke="#dfe7f1"/>
  <text x="644" y="284" fill="#64748b" font-family="Inter, Arial" font-size="13" font-weight="900" letter-spacing="2">AI ANSWER</text>
  <text x="644" y="320" fill="#0b1b31" font-family="Inter, Arial" font-size="19" font-weight="850">Carlos Alcaraz — Wimbledon 2024</text>
  <text x="644" y="350" fill="#991b1b" font-family="Inter, Arial" font-size="17">Answer selected one possible year.</text>

  <!-- Review reason -->
  <rect x="78" y="414" width="1044" height="142" rx="23" fill="#fff1f2" stroke="#fecaca"/>
  <text x="106" y="456" fill="#991b1b" font-family="Inter, Arial" font-size="27" font-weight="900">Ambiguity detected</text>
  <text x="106" y="493" fill="#475569" font-family="Inter, Arial" font-size="18">
    <tspan x="106" dy="0">The prompt did not specify the year, draw, or event type, so multiple valid</tspan>
    <tspan x="106" dy="27">answers exist. The answer chose one interpretation and needs human review.</tspan>
  </text>
  <rect x="906" y="506" width="178" height="34" rx="17" fill="#fee2e2"/>
  <text x="932" y="529" fill="#991b1b" font-family="Inter, Arial" font-size="13" font-weight="950">HUMAN REVIEW</text>

  <!-- Result cards -->
  <rect x="78" y="594" width="328" height="108" rx="19" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="104" y="630" fill="#15803d" font-family="Inter, Arial" font-size="15" font-weight="950">REQUESTED</text>
  <text x="104" y="664" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">Winner requested</text>
  <text x="104" y="690" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">but year missing</text>

  <rect x="436" y="594" width="328" height="108" rx="19" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="462" y="630" fill="#15803d" font-family="Inter, Arial" font-size="15" font-weight="950">PERFORMED</text>
  <text x="462" y="664" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">One interpretation</text>
  <text x="462" y="690" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">answered</text>

  <rect x="794" y="594" width="328" height="108" rx="19" fill="#fff1f2" stroke="#fecaca"/>
  <text x="820" y="630" fill="#991b1b" font-family="Inter, Arial" font-size="15" font-weight="950">AMBIGUITY</text>
  <text x="820" y="664" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">Missing year</text>
  <text x="820" y="690" fill="#0b1b31" font-family="Inter, Arial" font-size="20" font-weight="850">requires review</text>
</svg>
